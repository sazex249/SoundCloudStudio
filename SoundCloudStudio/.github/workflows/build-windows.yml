
name: Build SoundCloud Studio Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: SoundCloudStudio
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        working-directory: SoundCloudStudio
        run: |
          pyinstaller --noconfirm --clean SoundCloudStudio.spec

      - name: Package ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package
          Copy-Item SoundCloudStudio/dist/SoundCloudStudio.exe package/
          Compress-Archive -Path package/* -DestinationPath SoundCloudStudio-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundCloudStudio-Windows
          path: SoundCloudStudio-Windows.zip
